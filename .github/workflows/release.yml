name: Tag releases

# After every push to main, create the missing <plugin>--v<version> tags
# (same format as `claude plugin tag`). Idempotent: existing tags are skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push tags

concurrency:
  group: tag-releases
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + existing tags

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git identity for annotated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push missing release tags
        run: node scripts/tag-releases.mjs --push
